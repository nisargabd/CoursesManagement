play.http.secret.key = "changeme_this_is_a_very_long_secret_key_for_development_purposes_only_12345678901234567890"
play.server.http.port = 9099

# DATABASE
db.default.driver = org.postgresql.Driver
db.default.url = ${?DB_URL}
db.default.username = ${?DB_USERNAME}
db.default.password = ${?DB_PASSWORD}
db.default.jndiName = DefaultDS

jpa.default = default
hibernate.hbm2ddl.auto = update
hibernate.show_sql = true
hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# JWT / KEYCLOAK
security.jwt.jwk-set-uri = "http://keycloak:8080/realms/CourseManagement/protocol/openid-connect/certs"

# REDIS
redis.host = "localhost"
redis.port = 6379

# CORS
cors.allowed.origins = [ "*" ]
cors.allowed.methods = [ "GET", "POST", "PUT", "DELETE", "OPTIONS" ]
cors.allowed.headers = [ "Authorization", "Content-Type" ]

# FILTERS
play.filters.enabled += "com.sanketika.filters.CorsFilter"
play.filters.enabled += "com.sanketika.filters.AuthFilter"

# MODULES
play.modules.enabled += "com.sanketika.ActorModule"
